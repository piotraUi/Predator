<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Predator - połącz z serwerem</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #16171b; color: #ececf1; font-family: system-ui, "Segoe UI", sans-serif; }
  form { width: 360px; background: #1f2127; border: 1px solid #363a44; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; text-align: center; letter-spacing: .08em; }
  p { margin: 0; color: #9a9ca5; font-size: 14px; text-align: center; }
  input { font: inherit; padding: 12px; border-radius: 8px; border: 1px solid #363a44; background: #16171b; color: inherit; }
  button { font: inherit; font-weight: 700; padding: 12px; border: none; border-radius: 8px; background: #e63946; color: white; cursor: pointer; }
  .err { color: #ff6b6b; font-size: 14px; min-height: 1em; text-align: center; }
</style>
</head>
<body>
<form id="f">
  <h1>PREDATOR</h1>
  <p>Wpisz adres serwera gry (komputera, na którym działa serwer)</p>
  <input id="s" placeholder="np. 192.168.1.10:2567 lub localhost" autofocus />
  <div class="err" id="e"></div>
  <button>Połącz</button>
</form>
<script>
  const q = new URLSearchParams(location.search);
  s.value = q.get("server") || "localhost:2567";
  e.textContent = q.get("error") || "";
  f.onsubmit = (ev) => { ev.preventDefault(); e.textContent = "Łączenie…"; window.predator.connect(s.value); };
</script>
</body>
</html>
