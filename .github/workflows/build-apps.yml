# Buduje aplikacje: Windows (.exe), Android (.apk) i iOS (.ipa bez podpisu).
# Uruchom ręcznie w zakładce Actions → "Zbuduj aplikacje" → Run workflow,
# albo wypchnij tag, np. git tag v0.1.0 && git push --tags
name: Zbuduj aplikacje

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows (.exe)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Zbuduj grę (wbudowaną w aplikację)
        run: npm run build:app -w client
      - name: Zbuduj exe
        working-directory: desktop
        run: |
          npm ci
          node copy-client.js
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Predator-Windows
          path: desktop/release/*.exe
          retention-days: 3

  android:
    name: Android (.apk)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Zbuduj grę i projekt Android
        working-directory: client
        run: |
          npm run build:app
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync android
          # mikrofon do czatu głosowego
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml
      - name: Zbuduj APK
        working-directory: client/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Predator-Android
          path: client/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3

  ios:
    name: iOS (.ipa bez podpisu)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Zbuduj grę i projekt iOS
        working-directory: client
        run: |
          npm run build:app
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          npx cap sync ios
          # pozwól na połączenia http do Twojego serwera gry
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mikrofon służy do czatu głosowego ze znajomymi w grze.'" ios/App/App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Predator łączy się z serwerem gry w Twojej sieci.'" ios/App/App/Info.plist || true
      - name: Zbuduj aplikację (bez podpisu)
        working-directory: client/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Predator-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Predator-iOS
          path: client/ios/App/Predator-unsigned.ipa
          retention-days: 3
