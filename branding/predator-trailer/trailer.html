<!doctype html><html><meta charset="utf-8"><style>
html,body{margin:0;width:1920px;height:1080px;background:#000;overflow:hidden;font-family:"Liberation Sans","Arial","DejaVu Sans",sans-serif;color:#fff}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#000}
#c{position:absolute;inset:0;width:1920px;height:1080px}
.ov{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%);z-index:2}
#flash{background:radial-gradient(circle at 50% 50%,#fff3d6,#ff9a3c 75%);mix-blend-mode:screen;opacity:0;z-index:90}
#fade{background:#000;opacity:1;z-index:100}
.item{position:absolute;left:50%;top:50%;will-change:transform,opacity}
em{font-style:normal;background:linear-gradient(90deg,#ffb347,#f76707);-webkit-background-clip:text;color:transparent}
.card{border-radius:18px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.14)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.line.big{font-size:84px;font-weight:700;letter-spacing:.01em;text-shadow:0 6px 40px rgba(0,0,0,.7);white-space:nowrap}
.titlecard{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-30px}
.biglogo{width:980px;filter:drop-shadow(0 20px 50px rgba(0,0,0,.6))}
.tag{margin-top:34px;font-size:54px;line-height:1.25;font-weight:600;text-shadow:0 5px 30px rgba(0,0,0,.8)}
.tag.big2{font-size:96px;font-weight:800;margin-top:40px}
.tag.small2{white-space:nowrap;font-size:34px;font-weight:600;color:#fff;margin-top:26px;background:rgba(10,10,16,.62);padding:10px 30px;border-radius:14px}
.mshot{width:1920px;height:1080px;overflow:hidden}
.mshot img{width:100%;height:100%;object-fit:cover;display:block}
.mshot .shade{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0))}
.mcap{position:absolute;left:90px;bottom:70px;text-shadow:0 4px 24px rgba(0,0,0,.8)}
.mcap b{display:block;font-size:112px;line-height:1.05;letter-spacing:.01em}
.mcap span{display:block;font-size:44px;color:#ffd9b0;margin-top:10px;font-weight:500}
.chapter{font-size:112px;font-weight:800;letter-spacing:.04em;margin-top:-400px;white-space:nowrap;text-shadow:0 8px 50px rgba(0,0,0,.8)}
.chapter.sm{font-size:92px;margin-top:-450px}
.chapter.huge{font-size:380px;margin-top:0;letter-spacing:.08em;color:#fff;-webkit-text-stroke:16px #e8590c;paint-order:stroke fill;text-shadow:0 18px 60px rgba(0,0,0,.65)}
.chapter.left{margin-left:-520px;margin-top:-330px;text-align:left;font-size:120px;line-height:1.05;white-space:normal;width:760px}
.chips{display:flex;flex-direction:column;gap:16px;font-size:44px;font-weight:600;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.chips div{background:rgba(15,15,20,.68);border:2px solid rgba(255,179,71,.6);border-radius:16px;padding:14px 28px;backdrop-filter:blur(6px);white-space:nowrap}
.chips b{color:#ffb347}
.left2{margin-left:-480px;margin-top:300px;align-items:flex-start;font-size:38px}
.bigcap{margin-top:370px;font-size:70px;font-weight:700;white-space:nowrap;background:rgba(10,10,16,.62);border-radius:18px;padding:14px 40px;backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.12)}
.bigcap.right{margin-left:520px;margin-top:330px;font-size:54px}
.tile{width:900px;height:506px}
.tile .shade{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0))}
.tlabel{position:absolute;left:28px;bottom:20px;font-size:64px;font-weight:800;text-shadow:0 4px 20px #000}
.apexcard{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-40px}
.apexicon{width:210px;height:210px;filter:drop-shadow(0 18px 40px rgba(247,103,7,.7))}
.apextitle{font-size:260px;font-weight:800;letter-spacing:.16em;padding-left:.16em;line-height:1;background:linear-gradient(180deg,#fff2d6,#ffb347 45%,#f76707);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
.apexsub{font-size:56px;font-weight:600;margin-top:18px;text-shadow:0 4px 24px #000;background:rgba(10,10,16,.6);padding:8px 34px;border-radius:16px}
.statsbox{margin-top:480px}
.stats{font:30px/1.2 "DejaVu Sans Mono",monospace;padding:12px 26px;border-radius:12px;background:rgba(10,10,16,.72);border:1px solid rgba(255,255,255,.18);white-space:nowrap}
.stats b{color:#ffb347}
.devices{display:flex;gap:22px;margin-top:380px;font-size:46px;font-weight:700;white-space:nowrap}
.devices span{background:rgba(10,10,16,.7);border:2px solid rgba(255,179,71,.6);border-radius:16px;padding:12px 30px;backdrop-filter:blur(6px)}
.devices.feat{margin-top:462px;font-size:38px;font-weight:600}
.devices.feat span{border-color:rgba(255,255,255,.25)}
.card.phone{border-radius:30px;border:6px solid #15151a;box-shadow:0 40px 90px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.25)}
</style><body><div id="stage">
<canvas id="c" width="1920" height="1080"></canvas>
<div class="ov" id="vig"></div>
<div class="ov" id="flash"></div>
<div class="ov" id="fade"></div>
</div>
<script src="predator.js"></script></body></html>
